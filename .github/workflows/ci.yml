name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The protoc that generates the test messages. Keep Google.Protobuf in test/csharp at least as new
  PROTOC_VERSION: "36.2"

jobs:
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go that go.mod allows, and the latest
        go: [ go.mod, stable ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  csharp:
    name: Generated C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Generate, compile and test
        run: test/run.sh

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build the archives of every platform
        run: scripts/build-release.sh v0.0.0 dist
      - name: Run the linux-amd64 binaries
        run: |
          dir=$(mktemp -d)
          tar -xzf dist/protoc-gen-twirp_csharp_0.0.0_linux_amd64.tar.gz -C "$dir"
          "$dir"/protoc-gen-twirp_csharp_0.0.0_linux_amd64/protoc-gen-twirp_csharp --version | grep -Fx "protoc-gen-twirp_csharp v0.0.0"
          "$dir"/protoc-gen-twirp_csharp_0.0.0_linux_amd64/protoc-gen-twirpcs --version | grep -Fx "protoc-gen-twirpcs v0.0.0"
