# Builds the archives of a published GitHub release (tag vX.Y.Z), attests their build provenance and
# attaches them to the release with checksums.txt.

name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the archives to the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: scripts/build-release.sh "$TAG" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/protoc-gen-twirp_csharp_*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
